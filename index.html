<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Bingo Event v1</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
body{
font-family:sans-serif;
text-align:center;
background:#0f172a;
color:white;
margin:0;
padding:20px;
}

#controls button{
padding:10px 16px;
margin:5px;
border:none;
border-radius:8px;
background:#22c55e;
color:white;
font-size:15px;
}

#board{
display:grid;
grid-template-columns:repeat(5,70px);
gap:6px;
justify-content:center;
margin-top:20px;
}

.cell{
background:white;
color:black;
border-radius:10px;
height:70px;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
font-weight:bold;
}

.hit{
background:#facc15;
}

#draw{
font-size:100px;
margin:10px;
font-weight:bold;
}

.playerCard{
border:1px solid #444;
padding:6px;
margin:4px;
border-radius:6px;
}

@media (max-width:600px){
#board{grid-template-columns:repeat(5,60px);}
.cell{height:60px;}
}
</style>
</head>

<body>

<h1>🎉 BINGO 🎉</h1>

<div id="controls" style="display:none">
<button onclick="createRoom()">ルーム作成</button>
<button onclick="draw()">抽選</button>
<button onclick="autoDraw()">自動抽選</button>
<button onclick="resetGame()">リセット</button>
</div>

<div id="room"></div>
<div id="players"></div>
<div id="draw"></div>
<div id="history"></div>
<div id="qr"></div>

<div id="board"></div>

<div id="ranking"></div>

<audio id="drawSound" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>
<audio id="bingoSound" src="https://actions.google.com/sounds/v1/crowd/large_crowd_cheer.ogg"></audio>

<script>

// Firebase設定
const firebaseConfig = {
apiKey:"ここ",
authDomain:"ここ",
databaseURL:"ここ",
projectId:"ここ"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let params=new URLSearchParams(location.search);
let room=params.get("room");
let host=params.get("host");
let screen=params.get("screen");

const isHost=host=="1";
const isScreen=screen=="1";
const isPlayer=!isHost && !isScreen;

let playerId=localStorage.getItem("bingoId");
if(!playerId){
playerId=Math.random().toString(36).substring(2);
localStorage.setItem("bingoId",playerId);
}

let name=localStorage.getItem("bingoName");
if(isPlayer && !name){
name=prompt("名前");
localStorage.setItem("bingoName",name);
}

let history=[];
let autoMode=false;

// 主催者操作表示
if(isHost){
document.getElementById("controls").style.display="block";
}

// ルーム作成
function createRoom(){
const id=Math.random().toString(36).substring(2,7);
location.href="?room="+id+"&host=1";
}

// 参加
if(room){

document.getElementById("room").innerText="ROOM: "+room;

// QR
if(isHost){
const url=location.origin+location.pathname+"?room="+room;
document.getElementById("qr").innerHTML=
`<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${url}">`;
}

// カード生成
if(isPlayer) generateCard();

if(isPlayer){
db.ref("rooms/"+room+"/players/"+playerId).set({
name:name,
bingo:false
});
}

// プレイヤー監視
db.ref("rooms/"+room+"/players").on("value",snap=>{
updateDashboard(snap.val()||{});
});

// 抽選監視
db.ref("rooms/"+room+"/numbers").on("value",snap=>{
const nums=snap.val()||[];
history=nums;
updateHits(nums);
updateHistory();
});

}

// カード
function generateCard(){
const board=document.getElementById("board");
board.innerHTML="";
let nums=[];
while(nums.length<25){
let n=Math.floor(Math.random()*75)+1;
if(!nums.includes(n)) nums.push(n);
}
db.ref("rooms/"+room+"/players/"+playerId+"/card").set(nums);
nums.forEach(n=>{
let c=document.createElement("div");
c.className="cell";
c.innerText=n;
board.appendChild(c);
});
}

// 抽選
function draw(){
if(!isHost) return;

let num=Math.floor(Math.random()*75)+1;
slot(num);
document.getElementById("drawSound").play();

db.ref("rooms/"+room+"/numbers").once("value").then(snap=>{
let list=snap.val()||[];
if(list.includes(num)) return draw();
list.push(num);
db.ref("rooms/"+room+"/numbers").set(list);
});
}

function slot(final){
let count=0;
let s=setInterval(()=>{
document.getElementById("draw").innerText=
Math.floor(Math.random()*75)+1;
count++;
if(count>15){
clearInterval(s);
document.getElementById("draw").innerText=final;
}
},80);
}

function autoDraw(){
if(!isHost) return;
autoMode=!autoMode;
if(autoMode) loop();
}

function loop(){
if(!autoMode) return;
draw();
setTimeout(loop,4000);
}

function resetGame(){
if(!isHost) return;
db.ref("rooms/"+room).set({
numbers:[],
players:{}
});
location.reload();
}

// ヒット
function updateHits(list){

let hits=[];

document.querySelectorAll(".cell").forEach(c=>{
let num=Number(c.innerText);
if(list.includes(num)){
c.classList.add("hit");
hits.push(num);
}
});

if(isPlayer){
db.ref("rooms/"+room+"/players/"+playerId+"/hits").set(hits);
checkBingo();
}
}

// 履歴
function updateHistory(){
document.getElementById("history").innerText=
"履歴: "+history.join(", ");
}

// ビンゴ
function checkBingo(){

const cells=[...document.querySelectorAll(".cell")];
let grid=[];

for(let i=0;i<5;i++){
grid[i]=cells.slice(i*5,(i+1)*5)
.map(c=>c.classList.contains("hit"));
}

let bingo=false;

for(let i=0;i<5;i++){
if(grid[i].every(v=>v)) bingo=true;
if(grid.map(r=>r[i]).every(v=>v)) bingo=true;
}

if(grid.map((r,i)=>r[i]).every(v=>v)) bingo=true;
if(grid.map((r,i)=>r[4-i]).every(v=>v)) bingo=true;

if(bingo){
bingoEffect();
document.getElementById("bingoSound").play();
db.ref("rooms/"+room+"/players/"+playerId+"/bingo").set(true);
}
}

// 演出
function bingoEffect(){
let flash=0;
let i=setInterval(()=>{
document.body.style.background=
flash%2?"#22c55e":"#facc15";
flash++;
if(flash>8){
clearInterval(i);
document.body.style.background="#0f172a";
}
},200);
}

// ダッシュボード
function updateDashboard(players){

if(isPlayer){
document.getElementById("ranking").style.display="none";
document.getElementById("players").style.display="none";
return;
}

let total=Object.keys(players).length;
let html="参加: "+total+"<br><br>";

Object.values(players).forEach(p=>{
let hit=p.hits?p.hits.length:0;

html+=`
<div class="playerCard">
${p.name||"HOST"}  
ヒット:${hit}
${p.bingo?" 🎉BINGO":""}
</div>
`;

if(isHost && p.card){
html+=`<details><summary>カード</summary>
<div style="display:grid;grid-template-columns:repeat(5,30px);gap:2px">`;

p.card.forEach(n=>{
html+=`<div style="background:white;color:black">${n}</div>`;
});

html+="</div></details>";
}

});

document.getElementById("ranking").innerHTML=html;
}

// スクリーン
if(isScreen){
document.getElementById("controls").style.display="none";
document.getElementById("board").style.display="none";
document.body.style.zoom="1.5";
}

</script>

</body>
</html>
